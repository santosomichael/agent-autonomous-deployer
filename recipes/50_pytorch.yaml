name: pytorch
description: Install PyTorch and validate CUDA.
timeout_seconds: 1800
commands:
  - '{{ workspace }}/.venv/bin/pip install torch torchvision torchaudio'
verify:
  - '{{ workspace }}/.venv/bin/python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"'
