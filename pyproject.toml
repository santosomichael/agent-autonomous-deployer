[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-claw"
version = "0.1.0"
description = "Portable autonomous SSH research environment deployer"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
research-claw = "research_claw.cli:main"

[tool.setuptools]
packages = ["research_claw"]
