project: research-lab

target:
  host: 10.0.0.50
  port: 22
  user: research
  identity_file: ~/.ssh/id_ed25519
  accept_new_host_key: false
  connect_timeout_seconds: 8

inference:
  provider: ollama
  base_url: http://192.168.1.40:11434
  model: qwen3:14b
  timeout_seconds: 10

deployment:
  autonomous: true
  stop_on_failure: true
  allow_destructive: false
  require_passwordless_sudo: true
  workspace: ~/research-stack
  recipes:
    - 00_discovery
    - 10_base_linux
    - 20_python
    - 30_docker
    - 40_gpu_validate
    - 50_pytorch
    - 60_sionna
    - 90_final_verify
